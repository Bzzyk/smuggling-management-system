<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}">
<head>
    <title>Edycja opisu roli</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Edycja opisu roli</h5>
                    <a th:href="@{/roles}" class="btn btn-sm btn-light"><i class="bi bi-arrow-left"></i> Powrót</a>
                </div>
                <div class="card-body">
                    <div th:if="${descriptionError}" class="alert alert-danger" role="alert" th:text="${descriptionError}"></div>

                    <div class="mb-3">
                        <strong>Rola:</strong> 
                        <span class="badge bg-info text-dark ms-2" th:text="${role.name}">ADMIN</span>
                    </div>
                    
                    <form th:action="@{/roles/{id}/edit(id=${role.id})}" method="post">
                        <div class="mb-3">
                            <label for="description" class="form-label fw-bold">Opis roli:</label>
                            <textarea class="form-control" id="description" name="description" rows="3"
                                      th:classappend="${descriptionError} ? 'is-invalid' : ''"
                                      th:text="${role.description}" placeholder="Podaj opis roli..." maxlength="255"></textarea>
                            <div th:if="${descriptionError}" class="invalid-feedback" th:text="${descriptionError}"></div>
                        </div>
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Zapisz zmiany</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
