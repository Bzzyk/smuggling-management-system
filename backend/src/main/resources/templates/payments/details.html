<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Szczegóły płatności</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row mb-3">
        <div class="col d-flex align-items-center">
            <a th:href="@{/payments}" class="btn btn-outline-secondary me-3">
                <i class="bi bi-arrow-left"></i> Powrót do listy
            </a>
            <h2 class="mb-0">Szczegóły płatności</h2>
        </div>
        <div class="col text-end" sec:authorize="hasAnyRole('ADMIN', 'ACCOUNTANT')">
            <a th:href="@{/payments/{id}/edit(id=${payment.id})}" class="btn btn-primary">
                <i class="bi bi-pencil"></i> Edytuj
            </a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${successMessage}">Sukces</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-start border-5 border-success">
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <h3 class="card-title fw-bold">
                        <span th:text="${payment.paymentType}">Typ</span>
                        <span class="text-muted">#</span><span class="text-muted" th:text="${payment.id}">1</span>
                    </h3>
                    <p class="text-muted" th:text="${payment.description ?: 'Brak opisu płatności.'}">Opis</p>
                </div>
                <div class="col-md-4 text-end">
                    <span class="badge fs-5 mb-2"
                          th:classappend="${payment.status.name == 'ZAPLACONA' ? 'bg-success' : (payment.status.name == 'OCZEKUJACA' ? 'bg-warning text-dark' : 'bg-danger')}"
                          th:text="${payment.status.name}">STATUS</span>
                    <div class="fw-bold fs-4">
                        $<span th:text="${payment.amount}">0.00</span>
                    </div>
                </div>
            </div>
            <hr>
            <div class="row text-muted">
                <div class="col-md-4">
                    <i class="bi bi-journal-check me-1"></i> Zlecenie:
                    <strong th:text="${payment.order.title}">Zlecenie</strong>
                </div>
                <div class="col-md-4">
                    <i class="bi bi-calendar-event me-1"></i> Data płatności:
                    <strong th:text="${payment.paymentDate != null ? payment.paymentDate : 'Nieokreślona'}">Data</strong>
                </div>
                <div class="col-md-4">
                    <i class="bi bi-clock-history me-1"></i> Utworzono:
                    <strong th:text="${payment.createdAt}">Data</strong>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
