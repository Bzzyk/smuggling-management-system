<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Płatności</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row mb-3 align-items-center">
        <div class="col">
            <h2>Płatności</h2>
        </div>
        <div class="col text-end" sec:authorize="hasAnyRole('ADMIN', 'ACCOUNTANT')">
            <a th:href="@{/payments/create}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Dodaj płatność
            </a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${successMessage}">Sukces</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <span th:text="${errorMessage}">Błąd</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Zlecenie</th>
                        <th>Typ</th>
                        <th>Status</th>
                        <th>Kwota</th>
                        <th>Data płatności</th>
                        <th class="text-end">Akcje</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="payment : ${payments}">
                        <td>
                            <strong th:text="${payment.order.title}">Zlecenie</strong>
                        </td>
                        <td>
                            <span class="badge bg-secondary" th:text="${payment.paymentType}">TYP</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${payment.status.name == 'ZAPLACONA' ? 'bg-success' : (payment.status.name == 'OCZEKUJACA' ? 'bg-warning text-dark' : 'bg-danger')}"
                                  th:text="${payment.status.name}">STATUS</span>
                        </td>
                        <td class="fw-bold">
                            <span th:text="${payment.amount}">0.00</span>
                        </td>
                        <td th:text="${payment.paymentDate != null ? payment.paymentDate : '-'}">Data</td>
                        <td class="text-end">
                            <a th:href="@{/payments/{id}(id=${payment.id})}" class="btn btn-sm btn-outline-info">
                                <i class="bi bi-eye"></i> Szczegóły
                            </a>
                            <a sec:authorize="hasAnyRole('ADMIN', 'ACCOUNTANT')"
                               th:href="@{/payments/{id}/edit(id=${payment.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form sec:authorize="hasAnyRole('ADMIN', 'ACCOUNTANT')"
                                  th:action="@{/payments/{id}/delete(id=${payment.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(payments)}">
                        <td colspan="6" class="text-center py-4 text-muted">
                            <i class="bi bi-info-circle"></i> Brak płatności w systemie.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
