<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}">
<head>
    <title th:text="${transportForm.id == null ? 'Planowanie transportu' : 'Edycja transportu'}">Transport</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-calendar2-plus me-2"></i>
                        <span th:text="${transportForm.id == null ? 'Szkic transportu' : 'Edycja planu transportu'}">Transport</span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="${transportForm.id == null ? '/transports/create' : '/transports/' + transportForm.id + '/edit'}"
                          th:object="${transportForm}" method="post">

                        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                            <div th:if="${#fields.hasGlobalErrors()}">
                                <ul class="mb-0">
                                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Blad</li>
                                </ul>
                            </div>
                            <div th:unless="${#fields.hasGlobalErrors()}">
                                Popraw pola oznaczone ponizej.
                            </div>
                        </div>

                        <input type="hidden" th:field="*{id}">
                        <input type="hidden" th:field="*{orderId}">

                        <div class="mb-4">
                            <label class="form-label fw-bold">Zlecenie</label>
                            <div class="form-control bg-light" th:if="${selectedOrder != null}">
                                <strong th:text="${selectedOrder.title}">Zlecenie</strong>
                                <span class="text-muted ms-2">#<span th:text="${selectedOrder.id}">1</span></span>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('orderId')}" th:errors="*{orderId}">Blad zlecenia</div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="routeId" class="form-label fw-bold">Trasa katalogowa</label>
                                <select class="form-select" id="routeId" th:field="*{routeId}">
                                    <option value="">Brak trasy katalogowej</option>
                                    <option th:each="route : ${routes}" th:value="${route.id}"
                                            th:text="${route.name + ' (' + route.startPoint + ' -> ' + route.endPoint + ')'}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="transportDate" class="form-label fw-bold">Data transportu</label>
                                <input type="date" class="form-control" id="transportDate" th:field="*{transportDate}"
                                       th:classappend="${#fields.hasErrors('transportDate')} ? 'is-invalid' : ''" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('transportDate')}" th:errors="*{transportDate}">Blad daty</div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="startLocation" class="form-label fw-bold">Punkt startowy</label>
                                <input type="text" class="form-control" id="startLocation" th:field="*{startLocation}"
                                       th:classappend="${#fields.hasErrors('startLocation')} ? 'is-invalid' : ''" required maxlength="100">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('startLocation')}" th:errors="*{startLocation}">Blad</div>
                            </div>
                            <div class="col-md-6">
                                <label for="destination" class="form-label fw-bold">Cel</label>
                                <input type="text" class="form-control" id="destination" th:field="*{destination}"
                                       th:classappend="${#fields.hasErrors('destination')} ? 'is-invalid' : ''" required maxlength="100">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('destination')}" th:errors="*{destination}">Blad</div>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="plannedArrivalDate" class="form-label fw-bold">Planowana data przyjazdu</label>
                                <input type="date" class="form-control" id="plannedArrivalDate" th:field="*{plannedArrivalDate}"
                                       th:classappend="${#fields.hasErrors('plannedArrivalDate')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('plannedArrivalDate')}" th:errors="*{plannedArrivalDate}">Blad daty</div>
                            </div>
                            <div class="col-md-6">
                                <label for="description" class="form-label fw-bold">Notatki operacyjne</label>
                                <textarea class="form-control" id="description" th:field="*{description}" rows="2"></textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between pt-3 border-top">
                            <a th:href="${transportForm.id == null ? '/orders/' + transportForm.orderId : '/transports/' + transportForm.id}"
                               class="btn btn-secondary">Anuluj</a>
                            <button type="submit" class="btn btn-success px-4 fw-bold">
                                <i class="bi bi-save me-1"></i> Zapisz szkic
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
