<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}">
<head>
    <title>Wybór pojazdu</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Wybór pojazdu</h2>
            <div class="text-muted">
                Wymagana ladownosc: <strong th:text="${cargoPackagesTotal}">0</strong> paczek
            </div>
        </div>
        <a th:href="@{/transports/{id}(id=${transport.id})}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Transport
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <form method="get" th:action="@{/transports/{id}/vehicles(id=${transport.id})}" class="row g-2 align-items-end">
                <div class="col-sm-6 col-md-4">
                    <label for="vehicleType" class="form-label fw-bold">Typ pojazdu</label>
                    <select id="vehicleType" name="vehicleType" class="form-select">
                        <option value="">Wszystkie typy</option>
                        <option th:each="type : ${vehicleTypes}"
                                th:value="${type.name()}"
                                th:selected="${selectedVehicleType == type.name()}"
                                th:text="${type.name()}">VAN</option>
                    </select>
                </div>
                <div class="col-sm-auto">
                    <button type="submit" class="btn btn-primary">Filtruj</button>
                    <a th:href="@{/transports/{id}/vehicles(id=${transport.id})}" class="btn btn-outline-secondary">Wyczyść</a>
                </div>
            </form>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Rejestracja</th>
                        <th>Pojazd</th>
                        <th>Typ</th>
                        <th>Ladownosc</th>
                        <th class="text-end">Akcja</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="vehicle : ${vehicles}">
                        <td><span class="badge bg-secondary" th:text="${vehicle.registrationNumber}">BI12345</span></td>
                        <td th:text="${vehicle.brand + ' ' + vehicle.model}">Pojazd</td>
                        <td th:text="${vehicle.vehicleType}">VAN</td>
                        <td><span th:text="${vehicle.loadCapacity}">0</span> paczek</td>
                        <td class="text-end">
                            <form th:action="@{/transports/{id}/vehicles/{vehicleId}/assign(id=${transport.id}, vehicleId=${vehicle.vehicleId})}" method="post">
                                <button type="submit" class="btn btn-sm btn-success">
                                    <i class="bi bi-check2"></i> Przypisz
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(vehicles)}">
                        <td colspan="5" class="text-center text-muted py-4">Brak dostepnych pojazdow o wystarczajacej ladownosci.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center" th:if="${vehiclePage.totalPages > 1}">
            <a class="btn btn-outline-secondary btn-sm"
               th:classappend="${vehiclePage.first} ? 'disabled'"
               th:href="@{/transports/{id}/vehicles(id=${transport.id}, page=${vehiclePage.number - 1}, vehicleType=${selectedVehicleType})}">Poprzednia</a>
            <span>Strona <strong th:text="${vehiclePage.number + 1}">1</strong> z <strong th:text="${vehiclePage.totalPages}">1</strong></span>
            <a class="btn btn-outline-secondary btn-sm"
               th:classappend="${vehiclePage.last} ? 'disabled'"
               th:href="@{/transports/{id}/vehicles(id=${transport.id}, page=${vehiclePage.number + 1}, vehicleType=${selectedVehicleType})}">Nastepna</a>
        </div>
    </div>
</div>
</body>
</html>
