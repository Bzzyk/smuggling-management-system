<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}">
<head>
    <title>Wybór ładunku</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Wybór ładunku</h2>
            <div class="text-muted" th:text="${transport.startLocation + ' -> ' + transport.destination}">Trasa</div>
        </div>
        <a th:href="@{/transports/{id}(id=${transport.id})}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Transport
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Nazwa</th>
                        <th>Typ</th>
                        <th>Paczki</th>
                        <th>Wartosc</th>
                        <th class="text-end">Akcja</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="cargo : ${cargos}">
                        <td class="fw-bold" th:text="${cargo.name}">Ladunek</td>
                        <td th:text="${cargo.cargoType}">PAPIEROSY</td>
                        <td th:text="${cargo.packagesCount}">0</td>
                        <td>$<span th:text="${cargo.estimatedValue}">0.00</span></td>
                        <td class="text-end">
                            <form th:action="@{/transports/{id}/cargos/{cargoId}/assign(id=${transport.id}, cargoId=${cargo.cargoId})}" method="post">
                                <button type="submit" class="btn btn-sm btn-success">
                                    <i class="bi bi-plus-lg"></i> Dodaj
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(cargos)}">
                        <td colspan="5" class="text-center text-muted py-4">Brak wolnych ladunkow do przypisania.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center" th:if="${cargoPage.totalPages > 1}">
            <a class="btn btn-outline-secondary btn-sm"
               th:classappend="${cargoPage.first} ? 'disabled'"
               th:href="@{/transports/{id}/cargos(id=${transport.id}, page=${cargoPage.number - 1})}">Poprzednia</a>
            <span>Strona <strong th:text="${cargoPage.number + 1}">1</strong> z <strong th:text="${cargoPage.totalPages}">1</strong></span>
            <a class="btn btn-outline-secondary btn-sm"
               th:classappend="${cargoPage.last} ? 'disabled'"
               th:href="@{/transports/{id}/cargos(id=${transport.id}, page=${cargoPage.number + 1})}">Nastepna</a>
        </div>
    </div>
</div>
</body>
</html>
