<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}">
<head>
    <title>Raport ryzyka</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="mb-3">
        <h2>Raport ryzyka transportów</h2>
        <p class="text-muted mb-0">Aktywne transporty z wyliczonym wynikiem ryzyka.</p>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Transport</th>
                        <th>Zlecenie</th>
                        <th>Trasa</th>
                        <th>Dystans</th>
                        <th>Trudność</th>
                        <th>Poziom ryzyka</th>
                        <th>Wynik</th>
                        <th>Data</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="row : ${rows}">
                        <td>
                            <span class="text-muted">#</span><span th:text="${row.transportId()}">1</span>
                        </td>
                        <td th:text="${row.orderTitle()}">Zlecenie</td>
                        <td>
                            <strong th:text="${row.routeName()}">Trasa</strong>
                            <div class="small text-muted">
                                <span th:text="${row.startPoint()}">Start</span>
                                <span> -> </span>
                                <span th:text="${row.endPoint()}">Koniec</span>
                            </div>
                        </td>
                        <td>
                            <span th:text="${row.distanceKm()}">0</span> km
                        </td>
                        <td th:text="${row.difficultyName()}">Trudność</td>
                        <td>
                            <span class="badge" th:classappend="${row.riskLevel() <= 2 ? 'bg-success' : (row.riskLevel() == 3 ? 'bg-warning text-dark' : 'bg-danger')}"
                                  th:text="${row.riskLevel()}">1</span>
                        </td>
                        <td>
                            <span class="fw-bold" th:classappend="${row.riskScore() != null and row.riskScore().intValue() < 50 ? 'text-success' : (row.riskScore() != null and row.riskScore().intValue() < 75 ? 'text-warning' : 'text-danger')}"
                                  th:text="${row.riskScore()}">0</span>
                        </td>
                        <td th:text="${row.transportDate() != null ? row.transportDate() : '-'}">Data</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(rows)}">
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="bi bi-info-circle"></i> Brak aktywnych transportów z trasą.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
