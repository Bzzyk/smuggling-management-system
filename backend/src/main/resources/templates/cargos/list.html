<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head>
    <title>Ładunki - SMS</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row">
        <div class="col-12">
            <h1 class="mb-4">Ładunki</h1>
            
            <div class="card shadow">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nazwa</th>
                                    <th>Typ</th>
                                    <th>Ilość (paczki)</th>
                                    <th>Wartość szacunkowa</th>
                                    <th>Zlecenie</th>
                                    <th>Magazyn</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${cargos}">
                                    <td th:text="${c.id}"></td>
                                    <td th:text="${c.name}"></td>
                                    <td th:text="${c.cargoType.name}"></td>
                                    <td th:text="${c.packagesCount}"></td>
                                    <td th:text="${c.estimatedValue}"></td>
                                    <td th:text="${c.order != null ? c.order.title : '-'}"></td>
                                    <td th:text="${c.warehouse != null ? c.warehouse.name : '-'}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(cargos)}">
                                    <td colspan="7" class="text-center">Brak ładunków w systemie.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>
</body>
</html>
