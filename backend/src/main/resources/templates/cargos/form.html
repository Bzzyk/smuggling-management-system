<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}">
<head>
    <title th:text="${cargoForm.id == null ? 'Nowy ładunek' : 'Edycja ładunku'}">Ładunek</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-box-seam me-2"></i>
                        <span th:text="${cargoForm.id == null ? 'Nowy ładunek' : 'Edycja ładunku'}">Ładunek</span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="${cargoForm.id == null ? '/cargos/create' : '/cargos/' + cargoForm.id + '/edit'}"
                          th:object="${cargoForm}" method="post">

                        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                            <div th:if="${#fields.hasGlobalErrors()}">
                                <ul class="mb-0">
                                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Błąd ogólny</li>
                                </ul>
                            </div>
                            <div th:unless="${#fields.hasGlobalErrors()}">
                                Upewnij się, że poprawnie wypełniłeś wszystkie wymagane pola.
                            </div>
                        </div>

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">Nazwa</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required minlength="3" maxlength="100">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Błąd nazwy</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="cargoTypeId" class="form-label fw-bold">Typ ładunku</label>
                                <select class="form-select" id="cargoTypeId" th:field="*{cargoTypeId}"
                                        th:classappend="${#fields.hasErrors('cargoTypeId')} ? 'is-invalid' : ''" required>
                                    <option value="" disabled selected>Wybierz typ...</option>
                                    <option th:each="type : ${cargoTypes}" th:value="${type.id}" th:text="${type.name}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('cargoTypeId')}" th:errors="*{cargoTypeId}">Błąd typu</div>
                            </div>
                            <div class="col-md-6">
                                <label for="warehouseId" class="form-label fw-bold">Magazyn</label>
                                <select class="form-select" id="warehouseId" th:field="*{warehouseId}">
                                    <option value="">Brak przypisania</option>
                                    <option th:each="warehouse : ${warehouses}" th:value="${warehouse.id}" th:text="${warehouse.name}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="packagesCount" class="form-label fw-bold">Liczba paczek</label>
                                <input type="number" class="form-control" id="packagesCount" th:field="*{packagesCount}"
                                       th:classappend="${#fields.hasErrors('packagesCount')} ? 'is-invalid' : ''" min="1" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('packagesCount')}" th:errors="*{packagesCount}">Błąd liczby paczek</div>
                            </div>
                            <div class="col-md-6">
                                <label for="estimatedValue" class="form-label fw-bold">Szacowana wartość</label>
                                <div class="input-group" th:classappend="${#fields.hasErrors('estimatedValue')} ? 'has-validation' : ''">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="0.01" class="form-control" id="estimatedValue" th:field="*{estimatedValue}"
                                           th:classappend="${#fields.hasErrors('estimatedValue')} ? 'is-invalid' : ''" min="0" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('estimatedValue')}" th:errors="*{estimatedValue}">Błąd wartości</div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between pt-3 border-top">
                            <a th:href="@{/cargos}" class="btn btn-secondary">Anuluj</a>
                            <button type="submit" class="btn btn-success px-4 fw-bold">
                                <i class="bi bi-save me-1"></i> Zapisz ładunek
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
