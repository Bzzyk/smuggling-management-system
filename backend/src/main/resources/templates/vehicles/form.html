<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}">
<head>
    <title th:text="${vehicleForm.id == null ? 'Dodaj Pojazd' : 'Edytuj Pojazd'}">Pojazd</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-truck me-2"></i>
                        <span th:text="${vehicleForm.id == null ? 'Dodaj nowy pojazd do floty' : 'Edycja danych pojazdu'}">Dodaj pojazd</span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="${vehicleForm.id == null ? '/vehicles/create' : '/vehicles/' + vehicleForm.id + '/edit'}"
                          th:object="${vehicleForm}" method="post">
                        
                        <input type="hidden" th:field="*{id}" />

                        <!-- Rejestracja -->
                        <div class="mb-3">
                            <label for="registrationNumber" class="form-label fw-bold">Numer rejestracyjny</label>
                            <input type="text" class="form-control" id="registrationNumber" th:field="*{registrationNumber}"
                                   th:classappend="${#fields.hasErrors('registrationNumber')} ? 'is-invalid' : ''"
                                   placeholder="np. WX 12345" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('registrationNumber')}" th:errors="*{registrationNumber}">Błąd rejestracji</div>
                        </div>

                        <!-- Marka -->
                        <div class="mb-3">
                            <label for="brand" class="form-label fw-bold">Marka</label>
                            <input type="text" class="form-control" id="brand" th:field="*{brand}"
                                   th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid' : ''"
                                   placeholder="np. Ford" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}">Błąd marki</div>
                        </div>

                        <!-- Model -->
                        <div class="mb-3">
                            <label for="model" class="form-label fw-bold">Model</label>
                            <input type="text" class="form-control" id="model" th:field="*{model}"
                                   th:classappend="${#fields.hasErrors('model')} ? 'is-invalid' : ''"
                                   placeholder="np. Transit" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('model')}" th:errors="*{model}">Błąd modelu</div>
                        </div>

                        <!-- Typ -->
                        <div class="mb-3">
                            <label for="vehicleType" class="form-label fw-bold">Typ pojazdu</label>
                            <select class="form-select" id="vehicleType" th:field="*{vehicleType}"
                                    th:classappend="${#fields.hasErrors('vehicleType')} ? 'is-invalid' : ''" required>
                                <option value="" disabled selected>Wybierz typ...</option>
                                <option th:each="type : ${vehicleTypes}" th:value="${type.name()}" th:text="${type.displayName}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('vehicleType')}" th:errors="*{vehicleType}">Błąd typu</div>
                        </div>

                        <!-- Ładowność -->
                        <div class="mb-3">
                            <label for="loadCapacity" class="form-label fw-bold">Ładowność (kg)</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="loadCapacity" th:field="*{loadCapacity}"
                                       th:classappend="${#fields.hasErrors('loadCapacity')} ? 'is-invalid' : ''" required>
                                <span class="input-group-text">kg</span>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('loadCapacity')}" th:errors="*{loadCapacity}">Błąd ładowności</div>
                            </div>
                        </div>

                        <!-- Status dostępności -->
                        <div class="mb-4">
                            <div class="form-check form-switch fs-5">
                                <input class="form-check-input" type="checkbox" role="switch" id="available" th:field="*{available}">
                                <label class="form-check-label" for="available">Pojazd dostępny do dyspozycji</label>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/vehicles}" class="btn btn-secondary">Anuluj</a>
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-save me-1"></i> Zapisz
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
