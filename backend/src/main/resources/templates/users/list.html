<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}">
<head>
    <title>Lista użytkowników</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Użytkownicy</h2>
        <a th:href="@{/roles}" class="btn btn-secondary" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-shield-lock"></i> Zarządzaj Rolami
        </a>
    </div>

    <div th:if="${success}" class="alert alert-success" role="alert" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nazwa użytkownika</th>
                        <th>Imię i nazwisko</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th class="text-end">Akcje</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}">1</td>
                        <td th:text="${user.username}">admin</td>
                        <td th:text="${user.firstName + ' ' + user.lastName}">Jan Kowalski</td>
                        <td th:text="${user.email}">jan@example.com</td>
                        <td>
                            <span th:each="role : ${user.roles}" 
                                  class="badge bg-info text-dark me-1" 
                                  th:text="${role.name}">ADMIN</span>
                        </td>
                        <td>
                            <span th:if="${user.enabled}" class="badge bg-success">Aktywny</span>
                            <span th:unless="${user.enabled}" class="badge bg-danger">Zbanowany</span>
                        </td>
                        <td class="text-end" sec:authorize="hasRole('ADMIN')">
                            <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-primary" title="Edytuj role">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/users/{id}/toggle-ban(id=${user.id})}" method="post" class="d-inline"
                                  th:unless="${#lists.contains(user.roles.![name], 'ADMIN')}">
                                <button type="submit" class="btn btn-sm"
                                        th:classappend="${user.enabled} ? 'btn-danger' : 'btn-success'"
                                        th:title="${user.enabled} ? 'Zbanuj użytkownika' : 'Odblokuj użytkownika'">
                                    <i class="bi" th:classappend="${user.enabled} ? 'bi-slash-circle' : 'bi-check-circle'"></i>
                                </button>
                            </form>
                            <button class="btn btn-sm btn-secondary disabled" title="Nie można zbanować administratora"
                                    th:if="${#lists.contains(user.roles.![name], 'ADMIN')}">
                                <i class="bi bi-shield-fill-x"></i>
                            </button>
                        </td>
                        <td class="text-end" sec:authorize="!hasRole('ADMIN')">
                            <span class="text-muted"><i class="bi bi-dash"></i></span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="7" class="text-center text-muted py-3">Brak użytkowników w systemie.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
