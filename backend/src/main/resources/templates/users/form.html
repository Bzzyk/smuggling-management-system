<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}">
<head>
    <title>Edycja ról użytkownika</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Edycja ról użytkownika</h5>
                    <a th:href="@{/users}" class="btn btn-sm btn-light"><i class="bi bi-arrow-left"></i> Powrót</a>
                </div>
                <div class="card-body">
                    <p><strong>Użytkownik:</strong> <span th:text="${user.firstName + ' ' + user.lastName + ' (' + user.username + ')'}">Jan Kowalski (jan)</span></p>
                    <hr>
                    
                    <form th:action="@{/users/{id}/edit(id=${user.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Przypisane role:</label>
                            <div class="list-group">
                                <label class="list-group-item" th:each="role : ${allRoles}">
                                    <input class="form-check-input me-1" type="checkbox" name="roleIds"
                                           th:value="${role.id}"
                                           th:checked="${#lists.contains(user.roles.![id], role.id)}">
                                    <span th:text="${role.name}">ADMIN</span>
                                    <small class="text-muted d-block ms-4" th:text="${role.description}">Opis roli</small>
                                </label>
                            </div>
                        </div>
                        
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Zapisz zmiany</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
