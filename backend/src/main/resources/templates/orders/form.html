<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}">
<head>
    <title th:text="${orderForm.id == null ? 'Nowe Zlecenie' : 'Edycja Zlecenia'}">Zlecenie</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-journal-check me-2"></i>
                        <span th:text="${orderForm.id == null ? 'Nowe Zlecenie Przemytu' : 'Edycja Zlecenia Przemytu'}">Zlecenie</span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    
                    <form th:action="${orderForm.id == null ? '/orders/create' : '/orders/' + orderForm.id + '/edit'}"
                          th:object="${orderForm}" method="post">
                          
                        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                            <div th:if="${#fields.hasGlobalErrors()}">
                                <ul class="mb-0">
                                    <li th:each="err : ${#fields.globalErrors()}" th:text="${err}">Błąd ogólny</li>
                                </ul>
                            </div>
                            <div th:unless="${#fields.hasGlobalErrors()}">
                                Upewnij się, że poprawnie wypełniłeś wszystkie wymagane pola.
                            </div>
                        </div>
                        
                        <input type="hidden" th:field="*{id}" />

                        <!-- Sekcja 1: Podstawy -->
                        <h5 class="border-bottom pb-2 mb-3">1. Główne Informacje</h5>
                        <div class="mb-3">
                            <label for="title" class="form-label fw-bold">Tytuł Zlecenia</label>
                            <input type="text" class="form-control" id="title" th:field="*{title}"
                                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Błąd tytułu</div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-bold">Opis (np. ładunek, wytyczne)</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="3"
                                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''"></textarea>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Błąd opisu</div>
                        </div>

                        <!-- Sekcja 2: Realizacja -->
                        <h5 class="border-bottom pb-2 mb-3">2. Organizacja i Status</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="statusId" class="form-label fw-bold">Status Zlecenia</label>
                                <select class="form-select" id="statusId" th:field="*{statusId}"
                                        th:classappend="${#fields.hasErrors('statusId')} ? 'is-invalid' : ''" required>
                                    <option value="" disabled selected>Wybierz status...</option>
                                    <option th:each="status : ${statuses}" th:value="${status.id}" th:text="${status.name}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('statusId')}" th:errors="*{statusId}">Błąd statusu</div>
                            </div>
                            <div class="col-md-6">
                                <label for="responsibleUserId" class="form-label fw-bold">Główny Odpowiedzialny</label>
                                <select class="form-select" id="responsibleUserId" th:field="*{responsibleUserId}"
                                        th:classappend="${#fields.hasErrors('responsibleUserId')} ? 'is-invalid' : ''">
                                    <option value="" selected>--- Przypisz kierownika ---</option>
                                    <option th:each="user : ${responsibleUsers}" th:value="${user.id}" 
                                            th:text="${user.firstName + ' ' + user.lastName}"></option>
                                </select>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('responsibleUserId')}" th:errors="*{responsibleUserId}">Błąd kierownika</div>
                            </div>
                        </div>

                        <!-- Sekcja 3: Finanse i Daty -->
                        <h5 class="border-bottom pb-2 mb-3">3. Budżet i Harmonogram</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="plannedDate" class="form-label fw-bold">Planowana data ukończenia całości</label>
                                <input type="date" class="form-control" id="plannedDate" th:field="*{plannedDate}"
                                       th:classappend="${#fields.hasErrors('plannedDate')} ? 'is-invalid' : ''">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('plannedDate')}" th:errors="*{plannedDate}">Błąd daty</div>
                            </div>
                            <div class="col-md-6">
                                <label for="estimatedProfit" class="form-label fw-bold">Szacowany zysk netto ($)</label>
                                <div class="input-group" th:classappend="${#fields.hasErrors('estimatedProfit')} ? 'has-validation' : ''">
                                    <span class="input-group-text">$</span>
                                    <input type="number" step="0.01" class="form-control" id="estimatedProfit" th:field="*{estimatedProfit}"
                                           th:classappend="${#fields.hasErrors('estimatedProfit')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('estimatedProfit')}" th:errors="*{estimatedProfit}">Błąd zysku</div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between pt-3 border-top">
                            <a th:href="@{/orders}" class="btn btn-secondary">Anuluj</a>
                            <button type="submit" class="btn btn-success px-4 fw-bold">
                                <i class="bi bi-save me-1"></i> Zapisz Zlecenie
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
