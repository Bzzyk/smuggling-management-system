<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head>
    <title>Zlecenia - SMS</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row">
        <div class="col-12">
            <h1 class="mb-4">Zlecenia</h1>
            
            <div class="card shadow">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Tytuł</th>
                                    <th>Data planowana</th>
                                    <th>Status</th>
                                    <th>Utworzył</th>
                                    <th>Odpowiedzialny</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="order : ${orders}">
                                    <td th:text="${order.id}"></td>
                                    <td th:text="${order.title}"></td>
                                    <td th:text="${order.plannedDate}"></td>
                                    <td th:text="${order.status.name}"></td>
                                    <td th:text="${order.createdBy.username}"></td>
                                    <td th:text="${order.responsibleUser != null ? order.responsibleUser.username : '-'}"></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(orders)}">
                                    <td colspan="6" class="text-center">Brak zleceń w systemie.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>
</body>
</html>
