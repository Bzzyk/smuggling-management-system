<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head>
    <title>Zmień hasło - SMS</title>
</head>
<body>
<div layout:fragment="content" class="container mt-5 pt-3">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white text-center pt-4 pb-3">
                    <h4 class="mb-0">Zmiana hasła</h4>
                </div>
                <div class="card-body p-4">
                    
                    <div th:if="${success}" class="alert alert-success">
                        Hasło zostało pomyślnie zmienione! Możesz się teraz <a href="/login" class="alert-link">zalogować ponownie</a>.
                    </div>
                    
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}">
                        Wystąpił błąd
                    </div>

                    <form th:action="@{/change-password}" method="post" th:unless="${success}">
                        
                        <div class="mb-3">
                            <label for="oldPassword" class="form-label">Obecne hasło</label>
                            <input type="password" class="form-control" id="oldPassword" name="oldPassword" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">Nowe hasło</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                        </div>
                        
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label">Potwierdź nowe hasło</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Zmień hasło</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
