<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Smuggling Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { padding-top: 4.5rem; background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">🚬 SMS</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarCollapse" sec:authorize="isAuthenticated()">
            <ul class="navbar-nav me-auto mb-2 mb-md-0">
                <li class="nav-item">
                    <a class="nav-link" href="/">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" href="/users">Użytkownicy</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'BOSS')">
                    <a class="nav-link" href="/orders">Zlecenia</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'BOSS', 'SMUGGLER')">
                    <a class="nav-link" href="/transports">Transporty</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'BOSS')">
                    <a class="nav-link" href="/cargos">Ładunki</a>
                </li>
            </ul>
            <form class="d-flex align-items-center" th:action="@{/logout}" method="post">
                <span class="navbar-text me-3">
                    <span sec:authentication="name" class="fw-bold">Użytkownik</span>
                    <span class="badge bg-secondary ms-1" sec:authentication="principal.authorities">ROLE</span>
                </span>
                <a class="btn btn-outline-info btn-sm me-2" th:href="@{/change-password}">Zmień hasło</a>
                <button class="btn btn-outline-light btn-sm" type="submit">Wyloguj</button>
            </form>
        </div>
    </div>
</nav>

<div layout:fragment="content"></div>

<!-- Scripts -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>
