<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{fragments/layout}">
<head>
    <title>Magazyny - SMS</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row">
        <div class="col-12">
            <h1 class="mb-4">Magazyny</h1>
            
            <div class="card shadow">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nazwa</th>
                                    <th>Lokalizacja</th>
                                    <th>Maks. Pojemność</th>
                                    <th>Aktywny</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="w : ${warehouses}">
                                    <td th:text="${w.id}"></td>
                                    <td th:text="${w.name}"></td>
                                    <td th:text="${w.location}"></td>
                                    <td th:text="${w.maxCapacity}"></td>
                                    <td>
                                        <span th:if="${w.active}" class="badge bg-success">Tak</span>
                                        <span th:unless="${w.active}" class="badge bg-danger">Nie</span>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(warehouses)}">
                                    <td colspan="5" class="text-center">Brak magazynów w systemie.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
</div>
</body>
</html>
