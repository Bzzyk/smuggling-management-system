<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Magazyny</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row mb-3 align-items-center">
        <div class="col">
            <h2>Magazyny</h2>
        </div>
        <div class="col text-end" sec:authorize="hasAnyRole('ADMIN', 'BOSS')">
            <a th:href="@{/warehouses/create}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Dodaj magazyn
            </a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${successMessage}">Sukces</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <span th:text="${errorMessage}">Błąd</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Nazwa</th>
                        <th>Lokalizacja</th>
                        <th>Pojemność</th>
                        <th>Zajęte</th>
                        <th>Wolne</th>
                        <th>Wypełnienie</th>
                        <th>Status</th>
                        <th class="text-end">Akcje</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="warehouseView : ${warehouseViews}" th:with="warehouse=${warehouseView.warehouse()}">
                        <td>
                            <strong th:text="${warehouse.name}">Magazyn</strong>
                        </td>
                        <td th:text="${warehouse.location}">Lokalizacja</td>
                        <td th:text="${warehouse.maxCapacity}">0</td>
                        <td th:text="${warehouseView.usedCapacity()}">0</td>
                        <td>
                            <span th:classappend="${warehouseView.freeCapacity() < 0 ? 'text-danger fw-bold' : ''}"
                                  th:text="${warehouseView.freeCapacity()}">0</span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${warehouseView.usagePercentage() > 100 ? 'bg-danger' : (warehouseView.usagePercentage() >= 80 ? 'bg-warning text-dark' : 'bg-success')}"
                                  th:text="${warehouseView.usagePercentage() + '%'}">0%</span>
                        </td>
                        <td>
                            <span th:if="${warehouse.active}" class="badge bg-success">Aktywny</span>
                            <span th:unless="${warehouse.active}" class="badge bg-danger">Nieaktywny</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/warehouses/{id}(id=${warehouse.id})}" class="btn btn-sm btn-outline-info">
                                <i class="bi bi-eye"></i> Szczegóły
                            </a>
                            <a sec:authorize="hasAnyRole('ADMIN', 'BOSS')"
                               th:href="@{/warehouses/{id}/edit(id=${warehouse.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form sec:authorize="hasAnyRole('ADMIN', 'BOSS')"
                                  th:action="@{/warehouses/{id}/delete(id=${warehouse.id})}"
                                  method="post"
                                  class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(warehouseViews)}">
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="bi bi-info-circle"></i> Brak magazynów w systemie.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
