<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Szczegóły magazynu</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row mb-3">
        <div class="col d-flex align-items-center">
            <a th:href="@{/warehouses}" class="btn btn-outline-secondary me-3">
                <i class="bi bi-arrow-left"></i> Powrót do listy
            </a>
            <h2 class="mb-0">Szczegóły magazynu</h2>
        </div>
        <div class="col text-end" sec:authorize="hasAnyRole('ADMIN', 'BOSS')">
            <a th:href="@{/warehouses/{id}/edit(id=${warehouse.id})}" class="btn btn-primary">
                <i class="bi bi-pencil"></i> Edytuj
            </a>
        </div>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-1"></i>
        <span th:text="${successMessage}">Sukces</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="card shadow-sm border-start border-5 border-success">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h3 class="card-title fw-bold" th:text="${warehouse.name}">Magazyn</h3>
                    <p class="text-muted mb-0" th:text="${warehouse.location}">Lokalizacja</p>
                </div>
                <div>
                    <span th:if="${warehouse.active}" class="badge bg-success fs-6">Aktywny</span>
                    <span th:unless="${warehouse.active}" class="badge bg-danger fs-6">Nieaktywny</span>
                </div>
            </div>
            <hr>
            <div class="row text-muted">
                <div class="col-md-6">
                    <i class="bi bi-boxes me-1"></i> Maksymalna pojemność:
                    <strong th:text="${warehouse.maxCapacity}">0</strong>
                </div>
                <div class="col-md-6">
                    <i class="bi bi-clock-history me-1"></i> Utworzono:
                    <strong th:text="${warehouse.createdAt}">Data</strong>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
