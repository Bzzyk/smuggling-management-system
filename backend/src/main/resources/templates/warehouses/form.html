<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}">
<head>
    <title th:text="${warehouseForm.id == null ? 'Nowy magazyn' : 'Edycja magazynu'}">Magazyn</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-building me-2"></i>
                        <span th:text="${warehouseForm.id == null ? 'Nowy magazyn' : 'Edycja magazynu'}">Magazyn</span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="${warehouseForm.id == null ? '/warehouses/create' : '/warehouses/' + warehouseForm.id + '/edit'}"
                          th:object="${warehouseForm}" method="post">

                        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                            Upewnij się, że poprawnie wypełniłeś wszystkie wymagane pola.
                        </div>

                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">Nazwa</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" required minlength="3" maxlength="100">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Błąd nazwy</div>
                        </div>

                        <div class="mb-3">
                            <label for="location" class="form-label fw-bold">Lokalizacja</label>
                            <input type="text" class="form-control" id="location" th:field="*{location}"
                                   th:classappend="${#fields.hasErrors('location')} ? 'is-invalid' : ''" required maxlength="150">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('location')}" th:errors="*{location}">Błąd lokalizacji</div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="maxCapacity" class="form-label fw-bold">Maksymalna pojemność</label>
                                <input type="number" class="form-control" id="maxCapacity" th:field="*{maxCapacity}"
                                       th:classappend="${#fields.hasErrors('maxCapacity')} ? 'is-invalid' : ''" min="1" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('maxCapacity')}" th:errors="*{maxCapacity}">Błąd pojemności</div>
                            </div>
                            <div class="col-md-6 d-flex align-items-end">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" role="switch" id="active" th:field="*{active}">
                                    <label class="form-check-label fw-bold" for="active">Magazyn aktywny</label>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between pt-3 border-top">
                            <a th:href="@{/warehouses}" class="btn btn-secondary">Anuluj</a>
                            <button type="submit" class="btn btn-success px-4 fw-bold">
                                <i class="bi bi-save me-1"></i> Zapisz magazyn
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
