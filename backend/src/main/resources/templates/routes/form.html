<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org" layout:decorate="~{fragments/layout}">
<head>
    <title th:text="${routeForm.id == null ? 'Nowa Trasa' : 'Edycja Trasy'}">Trasa</title>
</head>
<body>
<div layout:fragment="content" class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-map me-2"></i>
                        <span th:text="${routeForm.id == null ? 'Definiowanie nowej trasy' : 'Konfiguracja mapy drogowej'}">Dodaj trasę</span>
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="${routeForm.id == null ? '/routes/create' : '/routes/' + routeForm.id + '/edit'}"
                          th:object="${routeForm}" method="post">
                        
                        <input type="hidden" th:field="*{id}" />

                        <!-- Nazwa -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-bold">Nazwa kodowa trasy</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   placeholder="np. Szlak Kaszubski" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Błąd nazwy</div>
                        </div>

                        <!-- Punkty trasy -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="startPoint" class="form-label fw-bold">Punkt startowy</label>
                                <input type="text" class="form-control" id="startPoint" th:field="*{startPoint}"
                                       th:classappend="${#fields.hasErrors('startPoint')} ? 'is-invalid' : ''"
                                       placeholder="np. Gdynia Port" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('startPoint')}" th:errors="*{startPoint}">Błąd</div>
                            </div>
                            <div class="col-md-6">
                                <label for="endPoint" class="form-label fw-bold">Punkt docelowy</label>
                                <input type="text" class="form-control" id="endPoint" th:field="*{endPoint}"
                                       th:classappend="${#fields.hasErrors('endPoint')} ? 'is-invalid' : ''"
                                       placeholder="np. Warszawa" required>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('endPoint')}" th:errors="*{endPoint}">Błąd</div>
                            </div>
                        </div>

                        <!-- Dystans -->
                        <div class="mb-3">
                            <label for="distanceKm" class="form-label fw-bold">Przybliżony dystans (km)</label>
                            <div class="input-group">
                                <input type="number" step="0.1" class="form-control" id="distanceKm" th:field="*{distanceKm}"
                                       th:classappend="${#fields.hasErrors('distanceKm')} ? 'is-invalid' : ''">
                                <span class="input-group-text">km</span>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('distanceKm')}" th:errors="*{distanceKm}">Błąd dystansu</div>
                            </div>
                        </div>

                        <!-- Poziom Trudności -->
                        <div class="mb-3">
                            <label for="difficultyLevelId" class="form-label fw-bold">Poziom trudności i ryzyka</label>
                            <select class="form-select" id="difficultyLevelId" th:field="*{difficultyLevelId}"
                                    th:classappend="${#fields.hasErrors('difficultyLevelId')} ? 'is-invalid' : ''" required>
                                <option value="" disabled selected>Wybierz stopień ryzyka...</option>
                                <option th:each="level : ${difficultyLevels}" th:value="${level.id}" 
                                        th:text="${level.name + ' (Poziom Ryzyka: ' + level.riskLevel + ')'}"></option>
                            </select>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('difficultyLevelId')}" th:errors="*{difficultyLevelId}">Błąd poziomu</div>
                        </div>
                        
                        <!-- Opis -->
                        <div class="mb-4">
                            <label for="description" class="form-label fw-bold">Dodatkowe instrukcje trasy (opcjonalnie)</label>
                            <textarea class="form-control" id="description" th:field="*{description}" rows="3"
                                      placeholder="Zaułki, patrole policyjne, stan dróg..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/routes}" class="btn btn-secondary">Anuluj</a>
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-save me-1"></i> Zapisz
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
