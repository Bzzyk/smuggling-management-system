<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - Smuggling Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background-color: white; }
    </style>
</head>
<body>

<div class="login-card">
    <h2 class="text-center mb-4">Logowanie</h2>
    
    <div th:if="${param.error}" class="alert alert-danger">
        Nieprawidłowa nazwa użytkownika lub hasło.
    </div>
    
    <div th:if="${param.logout}" class="alert alert-success">
        Zostałeś pomyślnie wylogowany.
    </div>
    
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Nazwa użytkownika</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Hasło</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="d-grid gap-2 mt-4">
            <button type="submit" class="btn btn-dark btn-lg">Zaloguj się</button>
        </div>
    </form>
</div>

</body>
</html>
